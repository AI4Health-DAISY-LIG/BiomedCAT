dataset:
  target_size: 40000

constraints:
  leaf_class:
    enabled: true
    min: 30
    target: 200

  hierarchy_depth:
    enabled: true
    bins:
      - [1, 2]
      - [3, 4]
      - [5, 6]
      - [7, 99]

  ambiguity:
    enabled: true
    categories:
      unambiguous: 0.70
      ambiguous: 0.30

  surface_form:
    enabled: true
    categories:
      common: 0.50
      uncommon: 0.50

  frequency_balancing:
    enabled: true
    inverse_freq_exponent: 0.7
