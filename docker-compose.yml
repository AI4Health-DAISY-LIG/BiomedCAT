services:
  # The API Bridge service (FastAPI)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biomedcat_api
    restart: always
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - GLM_MODEL_ID=THUDM/glm-4v-9b
    volumes:
      - ./Dataset:/app/data/Dataset
      - ./Output:/app/data/Output
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - biomedcat_network
    ports:
      - "8000:8000"

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biomedcat_pipeline
    restart: always
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=gemma4:12b-it-qat
      - GLM_MODEL_ID=THUDM/glm-4v-9b
    volumes:
      - ./Dataset:/app/data/Dataset
      - ./Output:/app/data/Output
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - biomedcat_network

  frontend:
    image: node:20-slim
    container_name: biomedcat_frontend
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    networks:
      - biomedcat_network
    depends_on:
      - api

networks:
  biomedcat_network:
    driver: bridge
