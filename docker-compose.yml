services:
  # Le moteur d'inférence (isolé dans son propre conteneur)
  ollama:
    image: ollama/ollama:latest
    container_name: biomedcat_ollama
    restart: always
    networks:
      - biomedcat_network
    # Si vous avez un GPU NVIDIA, décommentez les lignes suivantes :
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # L'API FastAPI (le pont entre le frontend et le pipeline)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biomedcat_api
    restart: always
    environment:
      - OLLAMA_URL=http://ollama:11434
      - GLM_MODEL_ID=THUDM/glm-4v-9b
      - OLLAMA_MODEL=gemma4:12b-it-qat
    volumes:
      - ./Dataset:/app/data
      - ./Output:/app/output
    command: uvicorn biomedcat.api:app --host 0.0.0.0 --port 8000
    networks:
      - biomedcat_network
    ports:
      - "8000:8000"

  # Le moteur de traitement (OCR -> NER -> Norm)
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biomedcat_pipeline
    restart: always
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=gemma4:12_b-it-qat
      - GLM_MODEL_ID=THUDM/glm-4v-9b
    volumes:
      - ./Dataset:/app/data
      - ./Output:/app/output
    networks:
      - biomedcat_network

  # L'interface utilisateur (Next.js)
  frontend:
    image: node:20-slim
    container_name: biomedcat_frontend
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    networks:
      - biomedcat_network
    depends_on:
      - api
      - ollama

networks:
  biomedcat_network:
    driver: bridge
