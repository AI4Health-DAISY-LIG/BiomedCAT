[project]
name = "biomedcat"
version = "0.1.0"
description = "Three-stage OCR → NER → Normalization pipeline for biomedical slides (FSHD)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch==2.6.0",
    "transformers==5.9.0",
    "accelerate==1.13.0",
    "bitsandbytes==0.49.2",
    "huggingface-hub==1.16.4",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "pillow==12.1.1",
    "pdf2image==1.17.0",
    "spacy==3.7.5",
    "scispacy==0.6.2",
    "aiohttp==3.13.3",
    "langchain-core==0.3.83",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["biomedcat"]

[dependency-groups]
dev = ["ruff", "mypy", "pytest"]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
