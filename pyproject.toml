[project]
name = "biomedcat"
version = "0.1.0"
description = "Biomedical Entity Extraction and Normalization Pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.9.0",
    "pillow>=12.1.1",
    "pdf2image>=1.17.0",
    "chromadb>=1.5.9",
    "rank-bm25>=0.2.2",
    "pytest>=9.1.1",
    "sentence-transformers>=6.0.0",
    "ollama>=0.6.2",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
