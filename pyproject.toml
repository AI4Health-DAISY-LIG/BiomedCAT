[project]
name = "biomedcat"
version = "0.1.0"
description = "Biomedical Entity Extraction and Normalization Pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    # Add other dependencies used by your stages here (e.g., python-pptx, pdf2image)
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
